name: CI Pipeline with Docker Verification

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_VERSION: '9.0.x'
  IMAGE_NAME: dotnetrestapi

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dotnetrestapi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: |
          dotnet restore src/src.csproj
          dotnet restore tests/src.UnitTests/src.UnitTests.csproj
          dotnet restore tests/src.IntegrationTests/src.IntegrationTests.csproj

      - name: Build application
        run: |
          dotnet build src/src.csproj --no-restore --configuration Release
          dotnet build tests/src.UnitTests/src.UnitTests.csproj --no-restore --configuration Release
          dotnet build tests/src.IntegrationTests/src.IntegrationTests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/src.UnitTests/src.UnitTests.csproj --no-build --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/src.IntegrationTests/src.IntegrationTests.csproj --no-build --configuration Release --verbosity normal
        env_file:
          - .env.example


  docker-verification:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create test environment file
        run: |
          cp .env.example .env

          echo "DB_HOST=postgres" >> .env

      - name: Test Docker Compose configuration
        run: |
          # Validate compose file syntax
          docker compose config

          # Build services without starting them
          docker compose build

          # Start services in background
          docker compose up -d

          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 30

          # Check if services are running
          docker compose ps

          # Check API health (if you have a health endpoint)
          echo "Testing API availability..."
          curl -f http://localhost:5131/health || echo "Health endpoint not available (this is OK for now)"

          # Check logs for any startup errors
          echo "Checking application logs..."
          docker compose logs dotnetrestapi

          # Cleanup
          docker compose down -v

      - name: Docker system info
        run: |
          echo "Docker images created:"
          docker images | grep -E "(dotnetrestapi|postgres)"
          echo "Docker containers status:"
          docker ps -a
