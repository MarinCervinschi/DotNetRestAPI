services:
  postgres:
    image: postgres:16
    container_name: dotnetapi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dotnetapi_network

  dotnetrestapi:
    image: dotnetrestapi:latest
    container_name: dotnetapi_app
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - "5131:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dotnetapi_network
    restart: always

volumes:
  postgres_data:

networks:
  dotnetapi_network:
    driver: bridge
